# motor_ai_node -- read once at startup from the path in
# MOTOR_AI_NODE_CONFIG, or /etc/motor-ai-node/node.conf.
#
# Every key here is one half of a contract with motor_ai_server: all four have
# to say the same thing in that program's server.conf. Nothing checks it, and
# a mismatch has no distinctive symptom -- the server signals a stage nobody
# is listening for and waits out result_timeout_ms, once per window.

# The directory the two meet in. The node reads <data_dir>/input_data/data.csv
# and writes <data_dir>/results/result.ini.
data_dir = /motor_data

# Where to publish this process's pid, for the server to signal.
#
# Written only after the signal handlers are installed. The order matters:
# sig_rul defaults to SIGTERM, whose default disposition is to terminate, so
# a window arriving in the gap would kill the node rather than wake it.
ai_pid_file = /motor_data/ai.pid

# Which signal means which model. Must match server.conf.
sig_anomaly = SIGUSR1
sig_fault_class = SIGUSR2
sig_rul = SIGTERM

# Where model/ and config/ live -- the trained artefacts, read once at startup.
# Defaults to ".", so a checkout runs from its own directory without a config
# file. The Yocto recipe installs them beside the binary and points here.
model_root = /usr/share/motor-ai-node

# How many past windows to pool into one verdict.
#
# READ THE SECOND HALF OF THIS COMMENT BEFORE TRUSTING THE FIRST.
#
# The original reasoning. window_rows = 26000 is 1.3 s at 20 kHz, which is one
# speed, and the models were fitted on features pooled across a full speed
# sweep -- current imbalance moves about ten times more with speed than with
# the fault. Measured on a failed motor, 20 windows:
#
#     pool_windows = 1     anomaly detected 3 of 6, one window read
#                          "early, 3.88 months" for a dead motor
#     pool_windows = 20    anomaly detected 19 of 20, RUL "failed" from the
#                          second window on; 1 false alarm in 20 on a healthy
#                          motor
#
# Two things have since undermined that.
#
# 1. The premise expired. AI commit 24fe3ba changed training to extract in
#    26000-row pieces, so a capture is now exactly what the models were fitted
#    on. The sweep/capture mismatch the ring was compensating for is gone.
#
# 2. The healthy motor above appears to have been one the model was FITTED ON.
#    That is an in-distribution test and cannot see the failure below.
#
# Measured host-side with the healthy recording held out. These numbers replace
# an earlier set (1 -> 16.7 %, 5 -> 63.1 %, 20 -> 100 %) that overstated the
# case in two ways, both since fixed:
#
#   - it fitted on one or two healthy recordings; there are now eight, and the
#     fit is on the seven that are not held out;
#   - it pooled TUMBLING groups of N, which divides the calibration set by N.
#     THE NODE'S RING SLIDES -- it holds the last N captures and emits a verdict
#     on every new one -- so the threshold can be calibrated on sliding pools
#     and keep nearly all of the training blocks. Tumbling pools at N = 20 left
#     52 training blocks to place a p95 threshold with. That is not a property
#     of pooling, it was a property of the measurement.
#
# Leave-one-healthy-recording-out over 8 recordings, sliding pools throughout
# (AI/host_pipeline/experiments/pool_choice.py):
#
#     pool_windows   verdict   n train   false alarm   detection    AUC
#        1             1.3 s     1106       12.5 %       74.7 %     0.848
#        5             6.5 s     1078       16.6 %       76.9 %     0.852
#       20            26.0 s      973       33.8 %       85.3 %     0.881
#
# So pooling does NOT saturate and is not the disaster the old numbers said.
# What survives is the mechanism, and it is enough on its own: averaging
# collapses the spread of the TRAINING scores, because those blocks are
# in-distribution, while a held-out recording's offset is systematic -- every
# capture in the ring carries the same one -- so the threshold shrinks onto the
# training set while the thing it must clear does not move:
#
#     pool    train sd    held-out median    threshold
#       1       3.63           8.90            13.98
#      20       1.82           8.65             9.40
#
# At 1 the threshold clears a held-out healthy recording by 57 %. At 20 it
# clears it by 8 %, and that margin is the false-alarm rate.
#
# 1 was therefore the operating point: a third of the false alarms and a 1.3 s
# verdict instead of 26 s. Read honestly, it was a TRADE and not a free win --
# pooling to 20 bought about 10 points of detection, and AUC mildly preferred it
# (0.881 against 0.848, inside a fold-to-fold sd of 0.05-0.06). What decided it
# is that a device has to place a threshold, and at 20 there was no good place
# to put one.
#
# ---------------------------------------------------------------------------
# 2026-08-20: RAISED TO 20. The reasoning above was sound and its premise is
# gone. Every number in it was measured on the 100 Hz legacy data, where all
# faults predated the rig, and with a 265-feature model. Rig sessions 2-4 put
# electrical faults on the rig at three severities, and the anomaly stage was
# refitted on FOUR current-balance features
# (AI/host_pipeline/experiments/rig_node_refit.py).
#
# There is now a good place to put a threshold. Leave-one-of-17-healthy-
# recordings-out, ring depth 20, threshold at a 5 % false-alarm budget:
#
#     severity   detection   AUC     delivered false alarms
#       8Rp        100.0 %   0.990        5.05 %  (90/1782 pooled vectors)
#       4Rp        100.0 %   0.994
#       2Rp        100.0 %   0.997
#
#     recording level: 34/34 faulty above EVERY healthy recording
#     healthy max 1.61, faulty min 6.71 -- the gap is empty space
#
# At ring depth 1 the same model catches 13-56 % of blocks depending on
# severity, at a 10 % budget. One 1.3 s capture is simply not enough signal;
# 26 s is. The rule the sweep encodes is that SECONDS ARE CHEAPER THAN FALSE
# ALARMS -- 26 s at a 5 % budget beats 13 s at 10 % on every severity, half the
# false alarms and better detection.
#
# THE THRESHOLD IN config/anomaly/threshold.json ASSUMES THIS VALUE. The ring
# medians FEATURES (see poolRing in src/inference.hpp), not scores, so the score
# distribution changes shape with the ring depth. Changing pool_windows without
# re-running rig_node_refit.py with a matching POOL leaves the threshold
# calibrated for a statistic the node no longer computes.
#
# VERIFIED ON THIS BINARY, 2026-08-20, with a held-out healthy recording --
# the first time that has ever been true here. The original 19-of-20 was
# in-distribution and is finally replaced.
# AI/host_pipeline/experiments/rig_ring_device.py drives this executable through
# its own config, SIGUSR1 and request.ini/result.ini, 34 consecutive captures
# per condition, normal_A_1 held out of the model it loads:
#
#     false alarms   1/15   (5 % budget)
#     8Rp           15/15
#     4Rp           15/15
#     2Rp           15/15
#
# Counted from the 20th capture on. The first 19 are the ring filling, and they
# also cover the change of condition -- THE RING IS NOT RESET between motors, so
# after a swap the first 19 verdicts are scored against a ring that still holds
# the previous machine. If this node is ever moved between motors without a
# restart, budget 26 s of meaningless verdicts.
# ---------------------------------------------------------------------------
#
# Memory is not a reason to raise or lower it: the ring holds feature vectors,
# not samples. 20 windows is about 50 kB. Peak RSS is ~11 MB, dominated by
# parsing the 26000-row CSV, and does not grow with this number.
pool_windows = 20
