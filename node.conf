# motor_ai_node -- read once at startup from the path in
# MOTOR_AI_NODE_CONFIG, or /etc/motor-ai-node/node.conf.
#
# Every key here is one half of a contract with motor_ai_server: all four have
# to say the same thing in that program's server.conf. Nothing checks it, and
# a mismatch has no distinctive symptom -- the server signals a stage nobody
# is listening for and waits out result_timeout_ms, once per window.

# The directory the two meet in. The node reads <data_dir>/input_data/data.csv
# and writes <data_dir>/results/result.ini.
data_dir = /motor_data

# Where to publish this process's pid, for the server to signal.
#
# Written only after the signal handlers are installed. The order matters:
# sig_rul defaults to SIGTERM, whose default disposition is to terminate, so
# a window arriving in the gap would kill the node rather than wake it.
ai_pid_file = /motor_data/ai.pid

# Which signal means which model. Must match server.conf.
sig_anomaly = SIGUSR1
sig_fault_class = SIGUSR2
sig_rul = SIGTERM

# Where model/ and config/ live -- the trained artefacts, read once at startup.
# Defaults to ".", so a checkout runs from its own directory without a config
# file. The Yocto recipe installs them beside the binary and points here.
model_root = /usr/share/motor-ai-node

# How many past windows to pool into one verdict.
#
# READ THE SECOND HALF OF THIS COMMENT BEFORE TRUSTING THE FIRST.
#
# The original reasoning. window_rows = 26000 is 1.3 s at 20 kHz, which is one
# speed, and the models were fitted on features pooled across a full speed
# sweep -- current imbalance moves about ten times more with speed than with
# the fault. Measured on a failed motor, 20 windows:
#
#     pool_windows = 1     anomaly detected 3 of 6, one window read
#                          "early, 3.88 months" for a dead motor
#     pool_windows = 20    anomaly detected 19 of 20, RUL "failed" from the
#                          second window on; 1 false alarm in 20 on a healthy
#                          motor
#
# Two things have since undermined that.
#
# 1. The premise expired. AI commit 24fe3ba changed training to extract in
#    26000-row pieces, so a capture is now exactly what the models were fitted
#    on. The sweep/capture mismatch the ring was compensating for is gone.
#
# 2. The healthy motor above appears to have been one the model was FITTED ON.
#    That is an in-distribution test and cannot see the failure below. Measured
#    host-side with the healthy recording held out
#    (AI/host_pipeline/experiments/pool_vs_width.py), false alarms on an unseen
#    healthy recording:
#
#        pool_windows = 1      16.7 %      detection 73 %
#        pool_windows = 5      63.1 %      detection 87 %
#        pool_windows = 20    100.0 %      detection 100 %
#
#    At 20 the detector saturates: 100 % detection AND 100 % false alarms is a
#    constant, not a detector, and "19 of 20" is consistent with that rather
#    than with detecting. Averaging collapses the training score spread tenfold
#    (sd 2.43 -> 0.23) because those blocks are in-distribution, while a
#    held-out recording's offset is systematic -- every capture in the ring
#    carries the same one -- so the threshold shrinks onto the training set
#    until nothing from a new day fits under it.
#
# So 1 is probably the better operating point, and it also gives 1.3 s verdicts
# instead of ~26 s. Left at 20 pending a device-side re-run of the test above
# with a held-out healthy recording. See AI/docs/STATE.md, anomaly section.
#
# The real fix is upstream of this knob: the covariance is fitted on ONE healthy
# recording. Going to two halves the false-alarm rate at pool_windows = 1
# (32.6 % -> 16.7 %) with AUC unchanged. Pooling cannot buy that.
#
# Memory is not a reason to lower it: the ring holds feature vectors, not
# samples. 20 windows is about 50 kB. Peak RSS is ~11 MB, dominated by parsing
# the 26000-row CSV, and does not grow with this number.
pool_windows = 20
